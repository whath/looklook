[package]
name = "looklook"
version = "0.1.5"
description = "A compact desktop watchlist"
edition = "2021"
rust-version = "1.90"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_json = "1"

[profile.release]
strip = true
